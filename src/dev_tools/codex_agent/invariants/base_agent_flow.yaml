schema:
  agent_entry_format:
    - name
    - mandatory
    - importance
  fields:
    name:
      description: "Имя агента. Ясное и широко понятное. Недвусмысленное."
    mandatory:
      description: "Обязательность агента."
      allowed_values:
        - required
        - optional
        - by_request
        - conditional
    importance:
      description: |
        Положительное целое число, определяющее масштаб исполнения роли.
        1 означает, что роль выполняется одним агентом самостоятельно.
        2 и больше означает, что агент обязан декомпозировать свою задачу
        на соответствующее количество подзадач и делегировать их новым агентам.
      type: integer
      minimum: 1


agents:
  - name: "Human Facing"
    mandatory: required
    importance: 1
    description: "Необходим для запуска первого агента"
    input:
    outputs:

  - name: "Problem highlighter"
    mandatory: conditional
    condition: "Если задача неоднозначна, масштабная, затрагивает существующую систему или пользователь просит исследовать проблему."
    importance: 1
    description: "Изучает проблему в системе. Масштабы, в какие слои разрослась, т.е. уточняет проблему и ставит цель для исследования"
    input:
    outputs:

  - name: "Researcher"
    mandatory: conditional
    condition: "Если для решения нужны факты из кода, документации, внешних источников, истории решений или сравнение вариантов."
    importance: 1
    description: "Читает из файла задачу и делает исследование"
    input:
    outputs:


  - name: "Specificator"
    mandatory: required
    importance: 1
    description: "Текущее положение дел. Желаемое состояние дел. Ограничения. Критерии принятия решения задачи. Риски."
    input:
    outputs:

  - name: "Agent Resources"
    mandatory: conditional
    condition: "Если задача требует больше одного специализированного агента, importance > 1 или нужна явная карта ролей перед исполнением."
    importance: 1
    description: "Пишет список агентов и их обязанности"
    input:
    outputs:

  - name: "Engineer + Quality checker"
    mandatory: required
    importance: 1
    loop:
      until: "quality_failed and iteration_num < 3"
    description: |
      Решают задачу и проверяют решение.
      На каждой итерации Engineer реализует или исправляет решение, Quality checker проверяет его против спецификации, тестов, рисков и критериев приемки.
      Если проверка не пройдена, Quality checker обязан вернуть конкретные замечания и минимальный список исправлений для следующей итерации.
      Если после 3 итераций проверка не пройдена, управление передается дальше
      Имена и точные роли сильно зависят от задачи
    input:
    outputs:

  - name: "Overall solution checker"
    mandatory: required
    importance: 1
    description: |
      Более критическая роль нежели Quality checker
      От решения сильно зависит стоит ли принимать решение. Если решение не прошло, то надо декомпозировать задачу и вызвать дополнительных исполнителей
    input:
    outputs:

  - name: "Fail analyzer"
    mandatory: conditional
    condition: "Если решение провалило финальную проверку, цикл качества исчерпан или причина провала неочевидна."
    importance: 1
    description: "Имя все говорит"
    input:
    outputs:

  - name: "Task Decomposer"
    mandatory: conditional
    condition: "Вызывается агентом для разбиения задачи на подзадачи."
    importance: 1
    description: "Только если группа по решению задачи попросила это сделать или если Overall"
